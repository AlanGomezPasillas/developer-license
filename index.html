<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alan Gómez Pasillas - Developer License</title>
    <meta name="description" content="Explore the interactive developer credential of Alan Gómez Pasillas: skills, experience and related links.">
    <meta name="author" content="Alan Gómez Pasillas">
    <meta name="apple-mobile-web-app-title" content="Developer License">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="canonical" href="https://alangomezpasillas.pages.dev/">

    <meta property="og:title" content="Alan Gómez Pasillas - Developer License">
    <meta property="og:description" content="Interactive developer credential: skills, experience, and links.">
    <meta property="og:type" content="profile">

    <style>
      .flex {
        display: flex;
        gap: 10px;
      }
  
      .col {
        display: flex;
        flex-direction: column;
      }

      .row {
        display: flex;
        flex-direction: row;
      }

      #personal-info {
        width: min-content;
      }

      .field {
        width: 100%;
        display: flex;
        border: solid 1px black;
      }

      .field > span {
        font-weight: bold;
        padding-left: 2px;
        padding-right: 2px;
      }

      data {
        text-align: center;
        background-color: grey;
        color: white;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Software Development Engineer</h1>
    <section id="personal-info" class="flex col">
      <h2>Personal Info</h2>
      <img width="256" height="256" src="img/profile-picture.webp" alt="Alan's profile picture">
      <div class="field">
        <span>Name:</span>
        <data id="name">Alan Gómez Pasillas</data>
      </div>
      <div class="flex row">
        <div class="field">
          <span>Country:</span>
          <data id="country">Mexico</data>
        </div>
        <div class="field">
          <span>Age:</span>
          <data id="age">25</data>
        </div>
      </div>
    </section>
  </body>
</html>
